[project]
name = "arttracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=5.2.0",
    "pytest>=8.3.5",
    "pytest-django>=4.11.1",
]
prod = [
    "gunicorn>=23.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "arttracker.settings"